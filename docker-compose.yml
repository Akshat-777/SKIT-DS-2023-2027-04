version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careerlens_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careerlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d careerlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: careerlens_auth_service
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://user:password@postgres:5432/careerlens
      JWT_SECRET: super-secret-careerlens-jwt-key-2026
      JWT_REFRESH_SECRET: super-secret-careerlens-refresh-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerlens_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/careerlens
      SECRET_KEY: super-secret-careerlens-jwt-key-2026
      STORAGE_PATH: ./uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
